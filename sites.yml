# Left out on purpose (known broken on 8 Nov 2026, would alert forever):
#   robertwolfe.nl (+www)    - Strikingly "under construction" 404
#   amsterdamcricketacademy.nl, otoman.nl, egbertenannette.nl,
#   wolfebusinessdevelopment.com - TransIP parking, certificate mismatch
#
# Braintoss (braintoss.app, braintoss.com, send.braintoss.app) is watched by
# rikwolfe/braintoss-monitor, on its own ntfy topic (handover 8 Nov 2026).

# DNS zones, checked every uptime run straight at their own Google Cloud DNS
# nameservers (no resolver cache, so a zone that stops being served shows up at
# once). project = the GCP project holding the zone; mail = must have MX records.
# mail_auth = checked daily by mailauth.yml (SPF, DKIM, DMARC): senders = who may
# send mail for the domain (google, m365, mailerlite, firebase, ses; [] = parked,
# never sends), dmarc = the policy we expect now. Raise dmarc here in the same
# change that raises it in DNS, or the check will flag it.
domains:
  - {name: wolfe.nl,                     ns: a, project: gen-lang-client-0815954328, mail: true, mail_auth: {senders: [google], dmarc: none}}
  - {name: richardwolfe.nl,              ns: b, project: gen-lang-client-0815954328, mail: true, mail_auth: {senders: [], dmarc: reject}}
  - {name: kawanaki.com,                 ns: d, project: gen-lang-client-0815954328, mail: true, mail_auth: {senders: [google], dmarc: none}}
  - {name: bespokesoftware.nl,           ns: a, project: gen-lang-client-0815954328, mail: true, mail_auth: {senders: [google], dmarc: none}}
  - {name: speedmailing.nl,              ns: a, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: speedmailing.com,             ns: a, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: wolfebusinessdevelopment.com, ns: a, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: amsterdamcricketacademy.nl,   ns: b, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: otoman.nl,                    ns: a, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: egbertenannette.nl,           ns: c, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: robertwolfe.nl,               ns: e, project: gen-lang-client-0815954328, mail_auth: {senders: [], dmarc: reject}}
  - {name: presage-ai.org,               ns: b, project: presage-ai-site, mail_auth: {senders: [], dmarc: reject}}
  - {name: gpcompanion.ai,               ns: a, project: ef2-learning-companion-487101, mail_auth: {senders: [firebase], dmarc: none}}   # only Firebase Auth mail (no MX, no Workspace)

# Projects whose billing must stay on (DNS zones or site hosting). Read by
# `monitor.py billing`, which Claude runs with Rik's sign-in after an alert:
# it proposes the fix, Rik approves it in Claude. relink: true = the fix is
# linking it back to the Wolfe Business Development billing account.
# wolfe-nl-site is left out: it runs on the free Firebase plan on purpose.
billing:
  - {project: gen-lang-client-0815954328,    relink: true}   # Bespoke Software Inc: most zones
  - {project: presage-ai-site,               relink: true}
  - {project: richard-wolfe-nl,              relink: true}
  - {project: ef2-learning-companion-487101, relink: false}  # own EF2 billing account
