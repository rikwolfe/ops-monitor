  - url: https://www.wolfe.nl/
  - url: https://richardwolfe.nl/
  - url: https://www.richardwolfe.nl/
  - url: https://handouts.richardwolfe.nl/
  - url: https://presage-ai.org/
  - url: https://www.presage-ai.org/
  - url: https://kawanaki.com/
  - url: https://www.kawanaki.com/
  - url: https://bespokesoftware.nl/
  - url: https://www.bespokesoftware.nl/
  - url: https://gpcompanion.ai/
  - url: https://www.gpcompanion.ai/
