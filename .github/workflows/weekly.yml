name: weekly

# Dead-man's switch: if this summary stops arriving on Monday morning,
# ops-monitor itself is broken.
on:
  schedule:
    # Monday 05:30 UTC = 06:30 Amsterdam in winter
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/985166590169/locations/global/workloadIdentityPools/github/providers/ops-monitor
          service_account: ops-monitor@rwolfe-watchdog.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::444625565274:role/ops-monitor-cost-read
          aws-region: us-east-1
      - name: Send summary
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
        run: python3 monitor.py weekly
