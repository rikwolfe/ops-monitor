name: weekly

# Dead-man's switch: if this summary stops arriving on Monday morning,
# ops-monitor itself is broken.
on:
  schedule:
    # Fallback only. Cloud Scheduler dispatches Monday 06:30 Europe/Amsterdam;
    # 06:30 UTC = 07:30 Amsterdam in winter.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read   # guard job lists recent runs
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  guard:
    # Cloud Scheduler (rwolfe-watchdog) starts this workflow on time via
    # workflow_dispatch. The cron above is only the fallback: a cron run steps
    # aside when Scheduler already started a run in the last 6 days.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            since=$(date -u -d '-6 days' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w weekly.yml -e workflow_dispatch --created ">=$since" --json databaseId -q length)
            if [ "$n" -gt 0 ]; then run=false; echo "Scheduler already ran since $since; skipping."; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  summary:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/985166590169/locations/global/workloadIdentityPools/github/providers/ops-monitor
          service_account: ops-monitor@rwolfe-watchdog.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::444625565274:role/ops-monitor-cost-read
          aws-region: us-east-1
      - name: Send summary
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
        run: python3 monitor.py weekly
