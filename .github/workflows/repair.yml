name: repair

# Billing guard + auto-repair. Checks that every project in sites.yml `billing:`
# has billing on; if one with repair: true has it off, links it back to the
# Wolfe Business Development billing account (max once per 24h), runs the
# postcheck and reports via ntfy. It can do nothing else: its own service
# account (ops-repair@) only has billing.user on that one billing account and
# billing.projectManager + browser on the allowlisted projects, and its own WIF
# pool only accepts this workflow file on main.
# Also started by uptime.yml when a zone stops being served.
on:
  workflow_dispatch:
    inputs:
      simulate_off:
        description: "Dry run: pretend billing is off on these projects (comma-separated)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/985166590169/locations/global/workloadIdentityPools/github-repair/providers/repair
          service_account: ops-repair@rwolfe-watchdog.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Check billing, repair if needed
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SIMULATE_OFF: ${{ inputs.simulate_off }}
        run: |
          if [ -n "$SIMULATE_OFF" ]; then
            python3 monitor.py billing --simulate-off="$SIMULATE_OFF"
          else
            python3 monitor.py billing
          fi
      - name: Commit state if it changed
        run: |
          git config user.name "ops-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "state: billing/repair changed"
            git pull --rebase --quiet
            git push
          fi
